<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The top 800 words paired with "she" or "he"</title>
<style>
  body {
    font-family: Georgia, serif;
    background: #fdf6ec;
    color: #222;
    padding: 40px 50px;
    margin: 0;
  }
  h1 { font-size: 1.9em; margin-bottom: 4px; }
  .subtitle {
    font-family: Helvetica, Arial, sans-serif;
    color: #555;
    margin-top: 0;
    margin-bottom: 30px;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.8em;
    font-weight: bold;
    letter-spacing: 0.05em;
    margin-bottom: 30px;
  }
  .legend .she { color: #d9534f; }
  .legend .he { color: #3a6fb0; }
  .legend-bar {
    width: 220px;
    height: 14px;
    background: linear-gradient(to right, #d9534f, #999, #3a6fb0);
    border-radius: 3px;
  }

  /* 40 columns x 20 rows = 800 units, each cell forced to a true square */
  .grid-wrap {
    position: relative;
    max-width: 1200px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(40, 1fr);
    grid-auto-rows: 1fr;
    gap: 2px;
  }

  .unit {
    aspect-ratio: 1 / 1;
    border-radius: 2px;
    cursor: pointer;
  }
  .unit.has-example {
    outline: 1px solid rgba(0,0,0,0.55);
    outline-offset: -1px;
  }
  .unit:hover {
    outline: 2px solid #222;
  }

  /* single shared tooltip, positioned by JS and clamped to .grid-wrap */
  #tooltip {
    display: none;
    position: absolute;
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    white-space: normal;
    text-align: left;
    line-height: 1.5;
    max-width: 260px;
    width: max-content;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    border: 1px solid rgba(0,0,0,0.3);
    z-index: 10;
    pointer-events: none;
  }
  #tooltip .word-label {
    display: block;
    margin-bottom: 4px;
  }
  #tooltip .example {
    display: block;
    font-weight: normal;
    font-style: italic;
    margin-top: 3px;
  }
  #tooltip .scripts {
    display: block;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(0,0,0,0.25);
    font-weight: normal;
    font-style: normal;
  }
  #tooltip .quote {
    display: block;
    margin-top: 6px;
  }
  #tooltip .quote:first-child { margin-top: 0; }
  #tooltip .quote-highlight {
    font-weight: bold;
    text-decoration: underline;
  }
</style>
</head>

"forgets*","misses","paces","going","rides","grins","growls","screws","steers","stamps","plummets","chuckles","loosens","explodes","dismounts","pins","circles","hammers","slashes*","limps","vomits","strains","yells","mumbles","chews",
"grunts","ponders","strolls","whistles","crashes","bounds","salutes","gropes","displays","replaces","lost*","smashes*","spills","loads","fails","stole*","barks*","ambles*","exchanges*","bows","drains","figures*","pitches","rears","vaults",
"kills*","howls*","shot*","gallops*","straps*"
    ].map(w => w.endsWith("*") ? { word: w.slice(0, -1), example: true } : { word: w, example: false });

    const total = words.length; // should be ~800; grid auto-fits whatever count is here

    function rankToColor(i, total) {
      const t = i / (total - 1); // 0 = full "she", 1 = full "he"
      const she = [217, 83, 79];
      const mid = [153, 153, 153];
      const he  = [58, 111, 176];
      let c1, c2, localT;
      if (t < 0.5) { c1 = she; c2 = mid; localT = t / 0.5; }
      else { c1 = mid; c2 = he; localT = (t - 0.5) / 0.5; }
      const rgb = c1.map((v, k) => Math.round(v + (c2[k] - v) * localT));
      return `rgb(${rgb.join(",")})`;
    }

    // Script excerpts for words with real source examples.
    // Fill in more entries here as you source real quotes for the other outlined squares.
    const scriptExamples = {
      snuggles: [
        "She snuggles up to him as they watch the movie.",
        "At this, she snuggles up to him. Oz smiles confidently.",
        "She snuggles up to him, strokes his back.",
        "She snuggles into him and closes her eyes. Holden stares...",
        "Malkovich kisses Maxine. She snuggles close to him. ...she snuggles into his arms. True love, at last...",
        "She snuggles into him, suddenly utterly secure."
      ],
      straps: [
        "Bob continues to hold up the weight of the backpack as he straps...",
        "...it very much, so he straps ten sticks...",
        "Todd has begun to dress. He straps a sheath knife to one ankle...",
        "He straps on a holster under his sealskin coat.",
        "He straps one to each Kid's wrist.",
        "As he straps on his wristbrace he peers down the lane... he straps the even-larger gear pack to himself."
      ]
    };

    // Bold + underline the "she/he <word>" phrase inside a quote, keeping original casing.
    function highlightQuote(word, quote) {
      const pattern = new RegExp(`\\b(she|he)\\s+${word}\\b`, "gi");
      return quote.replace(pattern, match => `<span class="quote-highlight">${match}</span>`);
    }

    const grid = document.getElementById("grid");
    const wrap = document.querySelector(".grid-wrap");
    const tooltip = document.getElementById("tooltip");

    function buildTooltipContent(w) {
      tooltip.innerHTML = "";
      tooltip.style.background = w.color;

      const label = document.createElement("span");
      label.className = "word-label";
      label.textContent = w.word;
      tooltip.appendChild(label);

      if (w.example) {
        const quotes = scriptExamples[w.word];
        if (quotes) {
          const scriptBox = document.createElement("span");
          scriptBox.className = "scripts";
          quotes.forEach(q => {
            const line = document.createElement("span");
            line.className = "quote";
            line.innerHTML = highlightQuote(w.word, q);
            scriptBox.appendChild(line);
          });
          tooltip.appendChild(scriptBox);
        } else {
          const ex = document.createElement("span");
          ex.className = "example";
          ex.textContent = "example needed from source";
          tooltip.appendChild(ex);
        }
      }
    }

    // Position the shared tooltip next to a given cell, clamped fully inside .grid-wrap.
    function positionTooltip(cell) {
      tooltip.style.display = "block";
      const wrapRect = wrap.getBoundingClientRect();
      const cellRect = cell.getBoundingClientRect();
      const tipRect = tooltip.getBoundingClientRect();

      const gap = 6;
      let top = (cellRect.top - wrapRect.top) - tipRect.height - gap; // try above
      if (top < 0) top = (cellRect.bottom - wrapRect.top) + gap;      // flip below if no room
      top = Math.max(0, Math.min(top, wrapRect.height - tipRect.height));

      let left = (cellRect.left - wrapRect.left) + cellRect.width / 2 - tipRect.width / 2;
      left = Math.max(0, Math.min(left, wrapRect.width - tipRect.width));

      tooltip.style.top = `${top}px`;
      tooltip.style.left = `${left}px`;
    }

    words.forEach((w, i) => {
      w.color = rankToColor(i, total);

      const cell = document.createElement("div");
      cell.className = "unit" + (w.example ? " has-example" : "");
      cell.style.background = w.color;
      cell.dataset.index = i;

      grid.appendChild(cell);
    });

    // Event delegation: one listener instead of 800.
    grid.addEventListener("mouseover", e => {
      const cell = e.target.closest(".unit");
      if (!cell) return;
      const w = words[cell.dataset.index];
      buildTooltipContent(w);
      positionTooltip(cell);
    });
    grid.addEventListener("mouseout", e => {
      const related = e.relatedTarget;
      if (related && related.closest && related.closest(".unit")) return;
      tooltip.style.display = "none";
    });
  </script>
